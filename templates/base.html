<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Results{% endblock %} | Delta State 2011</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="{{ url_for('home') }}">Delta State <span>2011 Results</span></a>
    <nav>
      <a href="{{ url_for('polling_unit_results') }}" class="{{ 'active' if request.endpoint == 'polling_unit_results' }}">Polling unit</a>
      <a href="{{ url_for('lga_results') }}" class="{{ 'active' if request.endpoint == 'lga_results' }}">LGA total</a>
      <a href="{{ url_for('add_result') }}" class="{{ 'active' if request.endpoint == 'add_result' }}">Add results</a>
    </nav>
  </div>
</header>
<main class="wrap">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="notice {{ category }}">{{ message }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer class="wrap foot">Bincom preliminary test &middot; Flask + MySQL</footer>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
